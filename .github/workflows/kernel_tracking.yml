name: Kernel Tracking

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-tracking
  cancel-in-progress: true

jobs:
  track-kernels:
    name: Track kernel hits
    runs-on: large-oss-linux
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MAX nightly
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install modular \
            --extra-index-url https://whl.modular.com/nightly/simple/

      - name: Run kernel tracker
        run: |
          source .venv/bin/activate
          python -m max.tools.kernel_tracker --test -o kernel_report.json

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-report-${{ github.sha }}
          path: kernel_report.json
          retention-days: 90
